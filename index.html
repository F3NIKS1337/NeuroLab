<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0e17">
<title>NeuroLab — Симулятор нейропатологий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NEUROLAB — Dark Scientific Theme
   ============================================================ */
:root{
  --bg: #0a0e17;
  --bg-elevated: #10151f;
  --bg-panel: #0d1219;
  --bg-hover: #1a2230;
  --border: #1e2937;
  --border-strong: #2d3a4d;

  --text: #e6edf5;
  --text-muted: #8899ac;
  --text-dim: #5a6b7f;

  --accent: #00d4ff;
  --accent-dim: #0095b8;
  --accent-glow: rgba(0, 212, 255, 0.15);
  --accent-glow-strong: rgba(0, 212, 255, 0.35);

  --success: #00e5a0;
  --warning: #ffb340;
  --danger: #ff4757;
  --danger-glow: rgba(255, 71, 87, 0.25);

  --frontal: #4a7cff;
  --parietal: #00d4a0;
  --temporal: #ff9d3d;
  --occipital: #b06bff;

  --mono: 'JetBrains Mono', 'SF Mono', monospace;
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
svg{width:20px;height:20px;fill:currentColor;display:block}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   APP LAYOUT
   ============================================================ */
.app{
  display:grid;
  grid-template-rows: 52px 1fr;
  height: 100dvh;
  background: var(--bg);
}

/* ============================================================
   TOP BAR
   ============================================================ */
.topbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding: 0 12px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  z-index: 40;
  position: relative;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  min-width: 0;
}
.logo-mark{
  width:30px;height:30px;
  border: 1.5px solid var(--accent);
  border-radius: 6px;
  display:grid;place-items:center;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: -0.5px;
  box-shadow: 0 0 12px var(--accent-glow);
  position: relative;
}
.logo-mark::before{
  content:'';
  position:absolute;
  inset:-1.5px;
  border-radius: 6px;
  border: 1.5px solid var(--accent);
  opacity: 0;
  animation: pulseBorder 2.5s ease-in-out infinite;
}
@keyframes pulseBorder{
  0%,100%{opacity:0;transform:scale(1)}
  50%{opacity:0.4;transform:scale(1.15)}
}
.logo-text h1{
  font-size: 14px;
  font-weight: 600;
  margin: 0;
  letter-spacing: 0.3px;
}
.logo-text small{
  display:block;
  font-size: 10px;
  color: var(--text-dim);
  font-family: var(--mono);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-top: 1px;
}
.spacer{flex:1}

.icon-btn{
  width: 36px;
  height: 36px;
  border-radius: 6px;
  display:grid;place-items:center;
  color: var(--text-muted);
  transition: all .15s ease;
  flex: none;
}
.icon-btn:active{background: var(--bg-hover);color:var(--accent)}
.icon-btn.active{color:var(--accent);background: var(--accent-glow)}

/* Status indicator in topbar */
.status-dot{
  display:flex;align-items:center;gap:6px;
  padding: 4px 10px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.status-dot::before{
  content:'';
  width:6px;height:6px;
  border-radius:50%;
  background: var(--success);
  box-shadow: 0 0 6px var(--success);
  animation: statusPulse 1.8s ease-in-out infinite;
}
@keyframes statusPulse{
  0%,100%{opacity:1}
  50%{opacity:0.4}
}
.status-dot.warn::before{background:var(--warning);box-shadow:0 0 6px var(--warning)}
.status-dot.danger::before{background:var(--danger);box-shadow:0 0 6px var(--danger)}

/* ============================================================
   BODY GRID
   ============================================================ */
.body{
  display:grid;
  grid-template-columns: 280px 1fr 360px;
  overflow: hidden;
  position: relative;
}

/* ============================================================
   SIDE PANELS
   ============================================================ */
.panel{
  background: var(--bg-panel);
  overflow-y: auto;
  padding: 14px 12px 24px;
}
.panel-left{border-right:1px solid var(--border)}
.panel-right{
  border-left: 1px solid var(--border);
  padding: 0;
  display: flex;
  flex-direction: column;
}

.panel-head{
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 4px 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 14px;
}
.panel-head .title{
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel-head .title::before{
  content: '';
  width: 3px;
  height: 12px;
  background: var(--accent);
  border-radius: 2px;
}
.close-btn{
  width: 30px;height:30px;
  border-radius: 6px;
  display: grid;place-items: center;
  color: var(--text-muted);
}
.close-btn:active{background: var(--bg-hover)}
@media (min-width:1241px){ #menuBtn,#closeDrawerBtn{display:none} }
@media (min-width:881px){ #panelBtn,#closePanelBtn{display:none} }

/* ============================================================
   SECTION HEADERS
   ============================================================ */
.section{
  margin-bottom: 18px;
}
.section-h{
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin: 0 0 8px 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.section-h .count{
  color: var(--text-muted);
  font-weight: 400;
}

/* ============================================================
   LAYER SWITCHES
   ============================================================ */
.layer-item{
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 10px;
  border-radius: 6px;
  border: 1px solid transparent;
  text-align: left;
  transition: all .15s ease;
  margin-bottom: 2px;
}
.layer-item:active{background: var(--bg-hover)}
.layer-item .indicator{
  width: 3px;
  height: 20px;
  border-radius: 2px;
  background: var(--text-dim);
  flex: none;
  transition: all .18s ease;
}
.layer-item .name{
  flex: 1;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  transition: color .18s;
}
.layer-item .count{
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-dim);
}
.layer-item.on .indicator{
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent-glow-strong);
}
.layer-item.on .name{color: var(--text)}

/* Toggle */
.toggle{
  position: relative;
  width: 34px;
  height: 18px;
  flex: none;
  background: var(--bg);
  border: 1px solid var(--border-strong);
  border-radius: 9px;
  transition: all .2s ease;
}
.toggle::after{
  content: '';
  position: absolute;
  top: 50%;
  left: 2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--text-dim);
  transform: translateY(-50%);
  transition: all .2s cubic-bezier(.2,.8,.2,1);
}
.layer-item.on .toggle{
  background: var(--accent-glow);
  border-color: var(--accent);
}
.layer-item.on .toggle::after{
  left: 18px;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent-glow-strong);
}

/* ============================================================
   REGION LIST
   ============================================================ */
.region-item{
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 10px;
  border-radius: 6px;
  border-left: 3px solid transparent;
  text-align: left;
  transition: all .15s ease;
  margin-bottom: 2px;
}
.region-item:active{background: var(--bg-hover)}
.region-item.selected{
  background: var(--accent-glow);
  border-left-color: var(--accent);
}
.region-item .bar{
  width: 12px;height: 12px;
  border-radius: 2px;
  flex: none;
}
.region-item .txt{min-width: 0;flex:1}
.region-item .txt b{
  display: block;
  font-size: 12.5px;
  font-weight: 500;
  margin-bottom: 2px;
}
.region-item .txt span{
  display: block;
  font-size: 10.5px;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ============================================================
   PATHOLOGY CARDS
   ============================================================ */
.pathology-item{
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: 100%;
  padding: 11px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  text-align: left;
  transition: all .18s ease;
  margin-bottom: 6px;
  position: relative;
  overflow: hidden;
}
.pathology-item::before{
  content:'';
  position: absolute;
  left: 0;top: 0;bottom: 0;
  width: 3px;
  background: var(--path-color, var(--text-dim));
  opacity: 0.5;
  transition: opacity .18s;
}
.pathology-item.selected{
  border-color: var(--path-color, var(--accent));
  background: color-mix(in srgb, var(--path-color, var(--accent)) 8%, var(--bg-elevated));
}
.pathology-item.selected::before{opacity: 1}
.pathology-item .p-ico{
  width: 30px;height:30px;
  border-radius: 5px;
  display:grid;place-items:center;
  color: #fff;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  flex: none;
  background: var(--path-color, var(--text-dim));
}
.pathology-item .p-body{flex:1;min-width:0}
.pathology-item .p-name{
  font-size: 12.5px;
  font-weight: 500;
  margin: 0 0 3px;
  color: var(--text);
}
.pathology-item .p-desc{
  font-size: 10.5px;
  color: var(--text-dim);
  line-height: 1.4;
  margin: 0;
}

/* ============================================================
   SEVERITY SLIDER
   ============================================================ */
.severity-box{
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  margin-top: 8px;
}
.severity-head{
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
}
.severity-head label{
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
}
.severity-head .val{
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

input[type=range]{
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 24px;
  background: transparent;
  display: block;
  touch-action: pan-y;
}
input[type=range]::-webkit-slider-runnable-track{
  height: 3px;
  border-radius: 2px;
  background: linear-gradient(to right, var(--accent) var(--p,50%), var(--border-strong) var(--p,50%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance: none;
  width: 16px; height: 16px;
  border-radius: 3px;
  background: var(--accent);
  margin-top: -6.5px;
  border: none;
  box-shadow: 0 0 10px var(--accent-glow-strong);
  transform: rotate(45deg);
}
input[type=range]::-moz-range-track{
  height: 3px; border-radius: 2px; background: var(--border-strong);
}
input[type=range]::-moz-range-progress{
  height: 3px; border-radius: 2px; background: var(--accent);
}
input[type=range]::-moz-range-thumb{
  width: 16px; height: 16px;
  border-radius: 3px;
  background: var(--accent);
  border: none;
  box-shadow: 0 0 10px var(--accent-glow-strong);
  transform: rotate(45deg);
}

/* ============================================================
   VIEWPORT
   ============================================================ */
.viewport{
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 45%, rgba(0, 212, 255, 0.06), transparent 60%),
    linear-gradient(180deg, #0a0e17 0%, #060810 100%);
}
#scene{
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: grab;
}
#scene:active{cursor: grabbing}

.viewport-top{
  position: absolute;
  top: 12px; left: 12px; right: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  pointer-events: none;
  z-index: 5;
}
.chip{
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 11px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: rgba(10, 14, 23, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  transition: all .15s ease;
  white-space: nowrap;
}
.chip::before{
  content: '';
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.4;
}
.chip.on{
  background: var(--accent-glow);
  border-color: var(--accent);
  color: var(--accent);
}
.chip.on::before{
  opacity: 1;
  box-shadow: 0 0 6px var(--accent);
}

.hint{
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  background: rgba(10, 14, 23, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 6px 14px;
  border-radius: 4px;
  border: 1px solid var(--border);
  pointer-events: none;
  text-align: center;
  max-width: 92%;
  text-transform: uppercase;
  z-index: 5;
}
.hint .sep{color: var(--border-strong); margin: 0 6px}

.tooltip{
  position: absolute;
  pointer-events: none;
  z-index: 20;
  padding: 6px 10px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  background: var(--bg-elevated);
  color: var(--accent);
  border: 1px solid var(--accent);
  box-shadow: 0 0 16px var(--accent-glow);
  transform: translate(-50%, -140%);
  opacity: 0;
  transition: opacity .15s ease;
  white-space: nowrap;
}
.tooltip.show{opacity: 1}

/* ============================================================
   RIGHT PANEL — TABS
   ============================================================ */
.tabs{
  display: flex;
  padding: 0;
  border-bottom: 1px solid var(--border);
  flex: none;
  background: var(--bg-elevated);
  align-items: center;
}
.tab{
  flex: 1;
  padding: 14px 10px 12px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
  border-bottom: 2px solid transparent;
  transition: all .15s ease;
  margin-bottom: -1px;
  position: relative;
}
.tab.active{
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.tab.active::after{
  content: '';
  position: absolute;
  bottom: -1px;
  left: 20%;
  right: 20%;
  height: 2px;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent-glow-strong);
}

.panel-scroll{
  overflow-y: auto;
  padding: 16px 14px;
  flex: 1;
}
.pane{display: none}
.pane.active{display: block; animation: fadeIn .22s ease}
@keyframes fadeIn{
  from{opacity:0; transform: translateY(4px)}
  to{opacity:1; transform: none}
}

/* ============================================================
   INFO CARDS
   ============================================================ */
.card{
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px;
  margin-bottom: 10px;
  position: relative;
}
.card .card-title{
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin: 0 0 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card h3{
  font-size: 16px;
  font-weight: 600;
  margin: 0 0 4px;
  line-height: 1.25;
  letter-spacing: -0.2px;
}
.card .subtitle{
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  margin: 0 0 12px;
  letter-spacing: 0.3px;
}
.card p{
  margin: 0;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--text-muted);
}

/* Badge */
.badge{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  background: var(--danger-glow);
  color: var(--danger);
  border: 1px solid var(--danger);
  margin-bottom: 10px;
}
.badge::before{
  content: '';
  width: 5px;height:5px;
  border-radius: 50%;
  background: currentColor;
  animation: statusPulse 1.2s ease-in-out infinite;
}

/* Stats grid */
.stats{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}
.stat{
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 10px;
}
.stat .k{
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--text-dim);
  display: block;
  margin-bottom: 3px;
}
.stat .v{
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

/* Tags */
.tags{
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin: 10px 0 0;
  padding: 0;
  list-style: none;
}
.tags li{
  font-family: var(--mono);
  font-size: 10.5px;
  padding: 4px 9px;
  border-radius: 3px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  color: var(--text-muted);
  letter-spacing: 0.3px;
}
.tags.danger li{
  background: rgba(255, 71, 87, 0.08);
  border-color: rgba(255, 71, 87, 0.3);
  color: var(--danger);
}

/* Empty state */
.empty{
  text-align: center;
  padding: 50px 20px;
  color: var(--text-dim);
}
.empty .ico{
  width: 60px;
  height: 60px;
  margin: 0 auto 16px;
  border-radius: 8px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  color: var(--text-dim);
}
.empty .ico svg{width:28px;height:28px;opacity: 0.5}
.empty p{
  margin: 0;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.7;
  letter-spacing: 0.3px;
}

/* Sub items */
.sub-item{
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 10px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--bg-panel);
  color: var(--text);
  font-size: 12px;
  text-align: left;
  transition: all .15s ease;
  margin-bottom: 4px;
}
.sub-item:active{
  border-color: var(--accent);
  background: var(--accent-glow);
}
.sub-item .pin{
  width: 6px; height: 6px;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
  flex: none;
}
.sub-item .go{
  margin-left: auto;
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 11px;
}

/* ============================================================
   SCRIM
   ============================================================ */
.scrim{
  position: fixed;
  inset: 52px 0 0 0;

function cortexNoise(x, y, z) {
  const n1 = Math.sin(x * 5.4 + 1.3) * Math.cos(y * 4.6 + 0.7) * Math.sin(z * 5.1 + 2.1) * 0.55;
  const n2 = Math.sin(x * 10.2 + y * 3.1) * Math.cos(z * 8.7 + x * 2.4) * 0.28;
  const n3 = Math.sin(y * 14.6 + z * 5.8) * Math.cos(x * 12.3 + 1.1) * 0.13;
  const n4 = Math.sin(z * 22.0 + y * 8.0) * Math.cos(x * 19.0 + z * 4.0) * 0.06;
  const n5 = Math.sin(x * 7.5 + z * 6.2) * Math.cos(y * 8.4) * 0.15;
  return n1 + n2 + n3 + n4 + n5;
}

function brainSurfacePoint(dir, offset = 0) {

}

   10. RAYCASTING — ВЫБОР ЗОН

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tooltipEl = document.getElementById('tooltip');

let hoveredRegion = null;
let selectedRegion = null;
let selectedSubarea = null;
let camTween = null;

function setPointerFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

function intersectAll() {
  raycaster.setFromCamera(pointer, camera);
  const objs = [];
  if (markersGroup.visible) objs.push(...markersGroup.children);
  if (cortexGroup.visible) objs.push(cortexMesh);
  return raycaster.intersectObjects(objs, false);
}

function pickRegionFromMesh(hit) {
  const local = cortexMesh.worldToLocal(hit.point.clone());
  return regionAt(local);
}

/* Hover (только десктоп) */
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return;
  setPointerFromEvent(e);
  const hits = intersectAll();
  let label = null, regionId = null;

  if (hits.length) {
    const h = hits[0];
    if (h.object.userData.type === 'subarea') {
      const sa = SUBAREAS.find(s => s.id === h.object.userData.id);
      if (sa) { label = sa.name; regionId = sa.region; }
    } else if (h.object === cortexMesh) {
      regionId = pickRegionFromMesh(h);
      label = REGIONS[regionId].name;
    }
  }

  if (regionId !== hoveredRegion) {
    hoveredRegion = regionId;
    applyCortexHighlight();
    canvas.style.cursor = regionId ? 'pointer' : 'grab';
  }

  if (label && regionId) {
    const r = canvas.getBoundingClientRect();
    tooltipEl.textContent = label;
    tooltipEl.style.left = (e.clientX - r.left) + 'px';
    tooltipEl.style.top  = (e.clientY - r.top) + 'px';
    tooltipEl.classList.add('show');
  } else {
    tooltipEl.classList.remove('show');
  }
});

canvas.addEventListener('pointerleave', () => {
  tooltipEl.classList.remove('show');
  hoveredRegion = null;
  applyCortexHighlight();
});

/* Click / Tap */
let downPos = null;
canvas.addEventListener('pointerdown', (e) => {
  downPos = { x: e.clientX, y: e.clientY };
});

canvas.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 8) return;

  setPointerFromEvent(e);
  const hits = intersectAll();
  if (!hits.length) {
    if (selectedRegion) {
      selectedRegion = null;
      selectedSubarea = null;
      applyCortexHighlight();
      renderAnatomy();
      closePanelMobile();
    }
    return;
  }

  const h = hits[0];
  if (h.object.userData.type === 'subarea') {
    const sa = SUBAREAS.find(s => s.id === h.object.userData.id);
    if (sa) {
      selectRegion(sa.region, true);
      selectedSubarea = sa.id;
      focusOn(subareaPos[sa.id]);
      highlightSubareaInList(sa.id);
    }
  } else if (h.object === cortexMesh) {
    const rid = pickRegionFromMesh(h);
    selectRegion(rid, false);
    focusOn(h.point.clone().multiplyScalar(0.9));
  }
});

/* ==========================================================================
   11. ФОКУСИРОВКА КАМЕРЫ
   ========================================================================== */
function focusOn(point) {
  const dir = point.clone().normalize();
  const dist = 2.6;
  const toPos = dir.multiplyScalar(dist).add(new THREE.Vector3(0, 0.15, 0));
  camTween = {
    from: camera.position.clone(),
    to: toPos,
    fromT: controls.target.clone(),
    toT: point.clone().multiplyScalar(0.35),
    t: 0
  };
}

/* ==========================================================================
   12. ПОДСВЕТКА КОРЫ
   ========================================================================== */
function applyCortexHighlight() {
  const arr = cortexGeo.attributes.color.array;
  const active = selectedRegion || hoveredRegion;

  if (!active) {
    arr.set(baseColors);
  } else {
    const hi = new THREE.Color(REGIONS[active].color).multiplyScalar(1.5);
    const dim = 0.35;
    for (let i = 0; i < vertexRegion.length; i++) {
      if (vertexRegion[i] === active) {
        arr[i*3]   = hi.r;
        arr[i*3+1] = hi.g;
        arr[i*3+2] = hi.b;
      } else {
        arr[i*3]   = baseColors[i*3]   * dim;
        arr[i*3+1] = baseColors[i*3+1] * dim;
        arr[i*3+2] = baseColors[i*3+2] * dim;
      }
    }
  }
  cortexGeo.attributes.color.needsUpdate = true;

  markerMeshes.forEach(m => {
    const sa = SUBAREAS.find(s => s.id === m.userData.id);
    const on = !active || sa.region === active;
    m.material.opacity = on ? 1 : 0.25;
    m.material.transparent = true;
    m.userData.halo.material.opacity = on ? 0.22 : 0.04;
  });

  if (active) {
    cortexMat.emissive.setHex(REGIONS[active].color);
  } else {
    cortexMat.emissive.setHex(0x00d4ff);
  }
}

   15. ЭФФЕКТЫ ПАТОЛОГИЙ
   ========================================================================== */
const lesionGroup = new THREE.Group();
brainGroup.add(lesionGroup);
const lesionMeshes = [];

function clearLesions() {
  lesionMeshes.forEach(m => {
    lesionGroup.remove(m);
    if (m.geometry) m.geometry.dispose();
    if (m.material) m.material.dispose();
  });
  lesionMeshes.length = 0;
}

function applyPathology(pathologyId, severity) {
  clearLesions();

  if (!pathologyId) {
    applyCortexHighlight();
    updatePathwayEffects();
    setStatus('READY', '');
    return;
  }

  const path = PATHOLOGIES.find(p => p.id === pathologyId);
  if (!path) return;

  const sev = severity / 100;

  // Красные ореолы на поражённых подзонах
  path.affected.forEach(saId => {
    const p = subareaPos[saId];
    if (!p) return;

    const radius = 0.10 + sev * 0.12;
    const g = new THREE.SphereGeometry(radius, 16, 16);
    const m = new THREE.MeshBasicMaterial({
      color: path.colorHex,
      transparent: true,
      opacity: 0.15 + sev * 0.35,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const mesh = new THREE.Mesh(g, m);
    mesh.position.copy(p);
    mesh.renderOrder = 4;
    mesh.userData = { type: 'lesion', baseOpacity: 0.15 + sev * 0.35 };
    lesionGroup.add(mesh);
    lesionMeshes.push(mesh);
  });

  // Подсветка коры в поражённых долях
  const affectedRegions = new Set(path.primaryRegions);
  const arr = cortexGeo.attributes.color.array;
  const red = new THREE.Color(path.colorHex);
  const dim = 0.5;
  const mixAmt = sev * 0.55;

  for (let i = 0; i < vertexRegion.length; i++) {
    const isAffected = affectedRegions.has(vertexRegion[i]);
    if (isAffected) {
      const baseR = baseColors[i*3];
      const baseG = baseColors[i*3+1];
      const baseB = baseColors[i*3+2];
      arr[i*3]   = baseR * (1 - mixAmt) + red.r * mixAmt;
      arr[i*3+1] = baseG * (1 - mixAmt) + red.g * mixAmt;
      arr[i*3+2] = baseB * (1 - mixAmt) + red.b * mixAmt;
    } else {
      arr[i*3]   = baseColors[i*3]   * dim;
      arr[i*3+1] = baseColors[i*3+1] * dim;
      arr[i*3+2] = baseColors[i*3+2] * dim;
    }
  }
  cortexGeo.attributes.color.needsUpdate = true;

  cortexMat.emissive.setHex(path.colorHex);
  cortexMat.emissiveIntensity = sev * 0.4;

  updatePathwayEffects();
  setStatus('ALERT', path.id === 'stroke' ? 'danger' : 'warn');
}

function updatePathwayEffects() {
  const path = state.pathology ? PATHOLOGIES.find(p => p.id === state.pathology) : null;
  const sev = state.severity / 100;

  pathwayMeshes.forEach(tube => {
    const c = pathCurves[tube.userData.pathId];
    if (!c) return;

    const isAffected = path && (path.affected.includes(c.a) || path.affected.includes(c.b));

    if (isAffected) {
      tube.material.color.setHex(0xff4757);
      tube.material.emissive.setHex(0x8a1f1a);
      tube.material.emissiveIntensity = 0.25 + (1 - sev) * 0.4;
      tube.material.opacity = 0.35 + (1 - sev) * 0.25;
    } else {
      tube.material.color.setHex(0xb06bff);
      tube.material.emissive.setHex(0x6b3fd6);
      tube.material.emissiveIntensity = 0.7;
      tube.material.opacity = 0.6;
    }
  });

  pulses.forEach(p => {
    const c = pathCurves[p.pathwayId];
    if (!c) return;
    const isAffected = path && (path.affected.includes(c.a) || path.affected.includes(c.b));

    if (isAffected) {
      p.speed = 0.02 + (1 - sev) * 0.06;
      p.mesh.material.color.setHex(0xff4757);
    } else {
      p.speed = 0.11;
      p.mesh.material.color.setHex(0x00d4ff);
    }
  });
}

/* ==========================================================================
   17. АНИМАЦИЯ
   ========================================================================== */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt * 1.9);
    const e = 1 - Math.pow(1 - camTween.t, 3);
    camera.position.lerpVectors(camTween.from, camTween.to, e);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    if (camTween.t >= 1) camTween = null;
  }

  if (state.chips.impulses && whiteMatterG.visible) {
    pulses.forEach(p => {
      p.t = (p.t + dt * p.speed) % 1;
      const pt = p.curve.getPointAt(p.t);
      p.mesh.position.copy(pt);
      const s = 0.8 + Math.sin(p.t * Math.PI) * 0.9;
      p.mesh.scale.setScalar(s);
      p.mesh.material.opacity = 0.35 + Math.sin(p.t * Math.PI) * 0.6;
    });
  }

  if (state.chips.labels && markersGroup.visible) {
    const s = 1 + Math.sin(t * 2.1) * 0.10;
    markerMeshes.forEach(m => {
      m.scale.setScalar(s);
      const on = !selectedRegion || SUBAREAS.find(x => x.id === m.userData.id).region === selectedRegion;
      m.material.emissiveIntensity = on ? (1.0 + Math.sin(t * 2.1) * 0.4) : 0.05;
    });
  }

  if (lesionMeshes.length) {
    const basePulse = 1 + Math.sin(t * 3.5) * 0.15;
    lesionMeshes.forEach(m => {
      m.material.opacity = m.userData.baseOpacity * basePulse;
      const s = 1 + Math.sin(t * 3.5) * 0.08;
      m.scale.setScalar(s);
    });
  }

  if (!state.pathology) {
    const pulseAmt = Math.sin(t * 1.3) * 0.03;
    cortexMat.emissiveIntensity = pulseAmt;
  }

  bottomLight.intensity = 1.2 + Math.sin(t * 0.8) * 0.3;

  controls.update();
  renderer.render(scene, camera);
}

    <span class="p-ico">${p.icon}</span>
    <span class="p-body">
      <span class="p-name">${p.name}</span>
      <span class="p-desc">${p.short}</span>
    </span>
  `;
  btn.addEventListener('click', () => selectPathology(p.id));
  pathologyListEl.appendChild(btn);
});

function selectPathology(id) {
  state.pathology = id;

  document.querySelectorAll('.pathology-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.pathology === (id || 'healthy'));
  });

  if (id) {
    severityBox.style.display = 'block';
    applyPathology(id, state.severity);
  } else {
    severityBox.style.display = 'none';
    clearLesions();
    applyCortexHighlight();
    updatePathwayEffects();
    setStatus('READY', '');
  }

  renderDiagnostics();
  if (innerWidth <= 880) openPanelMobile();
}

/* ==========================================================================
   22. UI — СЛАЙДЕР ТЯЖЕСТИ
   ========================================================================== */
const severitySlider = document.getElementById('severitySlider');
const severityVal = document.getElementById('severityVal');

function syncSeveritySlider() {
  const v = state.severity;
  severitySlider.value = v;
  severitySlider.style.setProperty('--p', v + '%');
  severityVal.textContent = v + '%';
}
syncSeveritySlider();

severitySlider.addEventListener('input', () => {
  state.severity = +severitySlider.value;
  severitySlider.style.setProperty('--p', state.severity + '%');
  severityVal.textContent = state.severity + '%';

  if (state.pathology) {
    applyPathology(state.pathology, state.severity);
  }
  renderDiagnostics();
});

/* ==========================================================================
   23. UI — ЧИПЫ ВВЕРХУ
   ========================================================================== */
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const key = chip.dataset.toggle;
    state.chips[key] = !state.chips[key];
    chip.classList.toggle('on', state.chips[key]);
    applyChipState(key);
  });
});

function applyChipState(key) {
  if (key === 'impulses') {
    pulses.forEach(p => p.mesh.visible = state.chips.impulses);
  }
  if (key === 'labels') {
    markersGroup.visible = state.chips.labels;
  }
  if (key === 'rotate') {
    controls.autoRotate = state.chips.rotate;
    controls.autoRotateSpeed = 0.9;
  }
}

/* ==========================================================================
   24. UI — ТАБЫ
   ========================================================================== */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('pane-' + tab.dataset.pane).classList.add('active');
  });
});

/* ==========================================================================
   25. РЕНДЕР — ДИАГНОСТИКА
   ========================================================================== */
const paneDiag = document.getElementById('pane-diagnostics');

function renderDiagnostics() {
  if (!state.pathology) {
    paneDiag.innerHTML = `
      <div class="empty">
        <div class="ico">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l4.59-4.58L18 11l-6 6z"/></svg>
        </div>
        <p>Мозг здоров.<br>Выберите патологию слева,<br>чтобы увидеть её влияние<br>на анатомию и симптомы.</p>
      </div>
    `;
    return;
  }

  const p = PATHOLOGIES.find(x => x.id === state.pathology);
  const sev = state.severity;
  const sevLabel = sev < 30 ? 'Лёгкая' : sev < 70 ? 'Средняя' : 'Тяжёлая';
  const affectedNames = p.affected
    .map(id => SUBAREAS.find(s => s.id === id)?.name || id)
    .slice(0, 6);

  paneDiag.innerHTML = `
    <div class="card" style="border-left:3px solid ${p.color}">
      <span class="badge" style="background:${p.color}22;color:${p.color};border-color:${p.color}">${sevLabel} · ${sev}%</span>
      <h3>${p.name}</h3>
      <p class="subtitle">${p.short}</p>
      <p>${p.desc}</p>

      <div class="stats">
        <div class="stat">
          <span class="k">Тяжесть</span>
          <span class="v">${sev}%</span>
        </div>
        <div class="stat">
          <span class="k">Стадия</span>
          <span class="v">${sevLabel}</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Патогенез</div>
      <p>${p.mechanism}</p>
    </div>

    <div class="card">
      <div class="card-title">Поражённые зоны <span style="color:var(--accent)">${p.affected.length}</span></div>
      <ul class="tags">
        ${affectedNames.map(n => `<li>${n}</li>`).join('')}
      </ul>
    </div>

    <div class="card">
      <div class="card-title">Нейромедиаторы</div>
      <ul class="tags">
        ${p.neurotransmitters.map(n => `<li>${n}</li>`).join('')}
      </ul>
    </div>

    <div class="card">
      <div class="card-title">Клинические симптомы</div>
      <ul class="tags danger">
        ${p.symptoms.map(s => `<li>${s}</li>`).join('')}
      </ul>
    </div>
  `;
}

/* ==========================================================================
   26. РЕНДЕР — АНАТОМИЯ
   ========================================================================== */
const paneAnatomy = document.getElementById('pane-anatomy');

function renderAnatomy() {
  if (!selectedRegion) {
    paneAnatomy.innerHTML = `
      <div class="empty">
        <div class="ico">
          <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7zm-1 19h2v1h-2v-1z"/></svg>
        </div>
        <p>Выберите долю на 3D-модели<br>или в списке слева,<br>чтобы изучить её строение.</p>
      </div>
    `;
    return;
  }

  const r = REGIONS[selectedRegion];
  const hex = '#' + r.color.toString(16).padStart(6,'0');
  const subs = SUBAREAS.filter(s => s.region === selectedRegion);

  paneAnatomy.innerHTML = `
    <div class="card" style="border-left:3px solid ${hex}">
      <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:12px">
        <div style="width:42px;height:42px;border-radius:6px;background:${hex};display:grid;place-items:center;color:#fff;font-family:var(--mono);font-size:16px;font-weight:700;flex:none;box-shadow:0 0 16px ${hex}66">${r.letter}</div>
        <div style="flex:1;min-width:0">
          <h3 style="margin:0 0 3px">${r.name}</h3>
          <p class="subtitle" style="margin:0">${r.latin}</p>
        </div>
      </div>
      <p>${r.desc}</p>

      <div class="stats">
        ${Object.entries(r.stats).map(([k,v]) => `
          <div class="stat">
            <span class="k">${k}</span>
            <span class="v">${v}</span>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-title">Ключевые функции</div>
      <ul class="tags">
        ${r.functions.map(f => `<li>${f}</li>`).join('')}
      </ul>
    </div>

    <div class="card">
      <div class="card-title">Зоны внутри доли <span style="color:var(--accent)">${subs.length}</span></div>
      ${subs.map(s => `
        <button class="sub-item" data-sub="${s.id}">
          <span class="pin"></span>
          <span>${s.name}</span>
          <span class="go">→</span>
        </button>
      `).join('')}
    </div>

    <div class="card" id="subNoteBox" style="display:none">
      <div class="card-title">О зоне</div>
      <p id="subNoteText"></p>
    </div>
  `;

  paneAnatomy.querySelectorAll('.sub-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const sid = btn.dataset.sub;
      const sa = SUBAREAS.find(s => s.id === sid);
      if (!sa) return;
      selectedSubarea = sid;
      focusOn(subareaPos[sid]);
      highlightSubareaInList(sid);

      const box = document.getElementById('subNoteBox');
      const txt = document.getElementById('subNoteText');
      box.style.display = 'block';
      txt.innerHTML = `<b style="color:var(--accent)">${sa.name}</b><br><br>${sa.note}`;
    });
  });
}

/* ==========================================================================
   27. RESET
   ========================================================================== */
document.getElementById('resetBtn').addEventListener('click', () => {
  selectPathology(null);

  Object.keys(state.layers).forEach(k => {
    state.layers[k] = true;
    setLayerVisibility(k, true);
  });
  document.querySelectorAll('.layer-item').forEach(el => el.classList.add('on'));

  selectedRegion = null;
  selectedSubarea = null;
  applyCortexHighlight();
  renderAnatomy();

  state.severity = 50;
  syncSeveritySlider();

  focusOn(new THREE.Vector3(0, 0.15, 0));
});

/* ==========================================================================
   28. БОКОВЫЕ ПАНЕЛИ
   ========================================================================== */
const drawer = document.getElementById('drawer');
const panel  = document.getElementById('panel');
const scrim  = document.getElementById('scrim');

function openDrawerMobile(){
  drawer.classList.add('open');
  panel.classList.remove('open');
  scrim.classList.add('show');
}
function closeDrawerMobile(){
  drawer.classList.remove('open');
  if (!panel.classList.contains('open')) scrim.classList.remove('show');
}
function openPanelMobile(){
  if (innerWidth <= 880) {
    panel.classList.add('open');
    drawer.classList.remove('open');
    scrim.classList.add('show');
  }
}
function closePanelMobile(){
  panel.classList.remove('open');
  if (!drawer.classList.contains('open')) scrim.classList.remove('show');
}

document.getElementById('menuBtn').addEventListener('click', () => {
  if (drawer.classList.contains('open')) closeDrawerMobile();
  else openDrawerMobile();
});
document.getElementById('panelBtn').addEventListener('click', () => {
  if (panel.classList.contains('open')) closePanelMobile();
  else openPanelMobile();
});
document.getElementById('closeDrawerBtn').addEventListener('click', closeDrawerMobile);
document.getElementById('closePanelBtn').addEventListener('click', closePanelMobile);
scrim.addEventListener('click', () => { closeDrawerMobile(); closePanelMobile(); });

/* Свайпы для закрытия */
function addSwipeClose(el, direction, onClose) {
  let startX = 0, startY = 0, tracking = false;
  el.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY; tracking = true;
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    if (!tracking) return;
    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if (direction === 'right' && dx > 60 && Math.abs(dy) < 80) { tracking = false; onClose(); }
    if (direction === 'left' && dx < -60 && Math.abs(dy) < 80) { tracking = false; onClose(); }
  }, { passive: true });
  el.addEventListener('touchend', () => { tracking = false; }, { passive: true });
}
addSwipeClose(drawer, 'right', closeDrawerMobile);
addSwipeClose(panel, 'left', closePanelMobile);

/* Escape */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeDrawerMobile();
    closePanelMobile();
    if (selectedRegion) {
      selectedRegion = null;
      applyCortexHighlight();
      renderAnatomy();
    }
  }
});

/* ==========================================================================
   29. RESIZE
   ========================================================================== */
function resize() {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  if (w === 0 || h === 0) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(viewport);
resize();

/* ==========================================================================
   30. ИНИЦИАЛИЗАЦИЯ
   ========================================================================== */
renderAnatomy();
renderDiagnostics();

// Синхронизация чипов с состоянием
document.querySelectorAll('.chip').forEach(chip => {
  const key = chip.dataset.toggle;
  chip.classList.toggle('on', state.chips[key]);
});

updatePathwayEffects();

camera.position.set(3.6, 2.4, 4.4);
focusOn(new THREE.Vector3(0, 0.15, 0));

animate();
</script>
