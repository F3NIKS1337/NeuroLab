<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#6750A4">
<title>NeuroLab — Интерактивная нейробиология</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#6750A4; --on-primary:#fff;
  --primary-container:#EADDFF; --on-primary-container:#21005D;
  --secondary:#625B71; --secondary-container:#E8DEF8; --on-secondary-container:#1D192B;
  --tertiary:#7D5260; --tertiary-container:#FFD8E4;
  --error:#B3261E; --on-error:#fff; --error-container:#F9DEDC;
  --surface:#FEF7FF; --surface-container:#F3EDF7; --surface-container-high:#ECE6F0;
  --surface-container-low:#F7F2FA; --surface-variant:#E7E0EC;
  --on-surface:#1D1B20; --on-surface-variant:#49454F;
  --outline:#79747E; --outline-variant:#CAC4D0;
  --bg:#F5EFF9;
  --shadow:0 1px 2px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.06);
  --shadow-lg:0 4px 12px rgba(0,0,0,.14),0 8px 28px rgba(0,0,0,.10);
  --accent-frontal:#5B7CFA; --accent-parietal:#2FB79B;
  --accent-temporal:#F29B30; --accent-occipital:#A96BF0;
  --accent-stem:#8B7AB8; --accent-nerves:#F2C94C;
}
[data-theme="dark"]{
  --primary:#D0BCFF; --on-primary:#381E72;
  --primary-container:#4F378B; --on-primary-container:#EADDFF;
  --secondary:#CCC2DC; --secondary-container:#4A4458; --on-secondary-container:#E8DEF8;
  --tertiary:#EFB8C8; --tertiary-container:#633B48;
  --error:#F2B8B5; --on-error:#601410; --error-container:#8C1D18;
  --surface:#141218; --surface-container:#211F26; --surface-container-high:#2B2930;
  --surface-container-low:#1D1B20; --surface-variant:#49454F;
  --on-surface:#E6E0E9; --on-surface-variant:#CAC4D0;
  --outline:#938F99; --outline-variant:#49454F;
  --bg:#0F0D13;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4);
  --shadow-lg:0 4px 12px rgba(0,0,0,.6),0 8px 32px rgba(0,0,0,.5);
  --accent-frontal:#8FA6FF; --accent-parietal:#5FD9C0;
  --accent-temporal:#FFBB66; --accent-occipital:#C79BFF;
  --accent-stem:#B4A5D8; --accent-nerves:#FFE066;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--on-surface);
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
  user-select:none;-webkit-user-select:none;
}
svg{width:24px;height:24px;fill:currentColor;display:block}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--outline-variant);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ============ APP SHELL ============ */
.app{display:grid;grid-template-rows:64px 1fr;height:100dvh}

.app-bar{
  display:flex;align-items:center;gap:6px;padding:0 8px;
  background:var(--surface-container);color:var(--on-surface);
  border-bottom:1px solid var(--outline-variant);
  z-index:40;position:relative;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{
  width:38px;height:38px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--primary),var(--accent-occipital));
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;
  box-shadow:var(--shadow);letter-spacing:-.5px;
}
.brand h1{font-size:16px;font-weight:500;margin:0;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--on-surface-variant);font-weight:400}
.spacer{flex:1}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  color:var(--on-surface-variant);display:grid;place-items:center;
  transition:background .18s ease,color .18s ease;flex:none;
}
.icon-btn:active{background:color-mix(in srgb,var(--on-surface) 12%,transparent)}
.icon-btn.accent{color:var(--primary)}

.body{display:grid;grid-template-columns:300px 1fr 380px;overflow:hidden;position:relative}

/* ============ SIDE PANELS ============ */
.side-panel{
  background:var(--surface-container-low);
  overflow-y:auto;padding:12px 14px 28px;
}
.side-left{border-right:1px solid var(--outline-variant)}
.side-right{border-left:1px solid var(--outline-variant);display:flex;flex-direction:column;padding:0}

.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 6px 12px 8px;
}
.panel-head .title{
  font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--on-surface-variant);
}
.close-btn{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;color:var(--on-surface-variant);
}
.close-btn:active{background:color-mix(in srgb,var(--on-surface) 12%,transparent)}
@media (min-width:1241px){ #menuBtn,#closeDrawer{display:none} }
@media (min-width:881px){ #panelBtn,#closePanel{display:none} }

/* ============ SECTION HEADERS ============ */
.section-h{
  font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--on-surface-variant);
  margin:18px 4px 10px;display:flex;align-items:center;gap:8px;
}
.section-h:first-child{margin-top:6px}

/* ============ LAYER SWITCHES ============ */
.layer-switch{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 12px;border-radius:14px;
  transition:background .18s ease;text-align:left;font-size:13.5px;
}
.layer-switch:active{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.layer-switch .sw-dot{
  width:12px;height:12px;border-radius:50%;flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,currentColor 15%,transparent);
}
.layer-switch .sw-name{flex:1;font-weight:500}
.layer-switch .sw-count{
  font-size:10.5px;font-weight:500;color:var(--on-surface-variant);
  background:var(--surface-container);padding:2px 7px;border-radius:6px;
  margin-right:4px;
}

/* MD3 Switch */
.md-switch{
  position:relative;width:46px;height:28px;flex:none;
  background:var(--surface-variant);border-radius:14px;
  border:2px solid var(--outline);transition:all .22s ease;
}
.md-switch::after{
  content:'';position:absolute;top:50%;left:4px;
  width:16px;height:16px;border-radius:50%;
  background:var(--outline);transform:translateY(-50%);
  transition:all .22s cubic-bezier(.2,.8,.2,1);
}
.layer-switch.on .md-switch{background:var(--primary);border-color:var(--primary)}
.layer-switch.on .md-switch::after{
  left:24px;width:20px;height:20px;
  background:var(--on-primary);
}

/* ============ PATHOLOGY LIST ============ */
.pathology-item{
  display:flex;align-items:flex-start;gap:12px;width:100%;
  padding:12px;border-radius:14px;text-align:left;
  border:1.5px solid transparent;
  background:var(--surface-container);margin-bottom:6px;
  transition:all .18s ease;
}
.pathology-item:active{transform:scale(.985)}
.pathology-item.selected{
  border-color:var(--primary);
  background:color-mix(in srgb,var(--primary) 10%,var(--surface-container));
}
.pathology-item .p-ico{
  width:36px;height:36px;border-radius:10px;flex:none;
  display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700;
}
.pathology-item .p-body{flex:1;min-width:0}
.pathology-item .p-name{font-size:13.5px;font-weight:500;margin:0 0 3px}
.pathology-item .p-desc{font-size:11.5px;color:var(--on-surface-variant);line-height:1.4}

/* ============ SEVERITY SLIDER ============ */
.severity-box{
  background:var(--surface-container);border-radius:16px;
  padding:14px 16px;margin:8px 0 4px;
  border:1px solid var(--outline-variant);
}
.severity-head{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:10px;gap:10px;
}
.severity-head label{font-size:13px;font-weight:500}
.severity-head .val{
  font-size:13px;font-weight:700;color:var(--primary);
  background:var(--secondary-container);padding:2px 10px;border-radius:8px;
  font-variant-numeric:tabular-nums;
}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:24px;
  background:transparent;display:block;touch-action:pan-y;
}
input[type=range]::-webkit-slider-runnable-track{
  height:5px;border-radius:3px;
  background:linear-gradient(to right,var(--primary) var(--p,50%),var(--outline-variant) var(--p,50%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--primary);margin-top:-9px;border:none;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--outline-variant)}
input[type=range]::-moz-range-progress{height:5px;border-radius:3px;background:var(--primary)}
input[type=range]::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;background:var(--primary);border:none;
}

/* ============ VIEWPORT ============ */
.viewport{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%, color-mix(in srgb,var(--primary) 10%,transparent), transparent 65%),
    var(--bg);
}
#scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}

.viewport-top{
  position:absolute;top:12px;left:12px;right:12px;
  display:flex;flex-wrap:wrap;gap:8px;pointer-events:none;z-index:5;
}
.chip{
  pointer-events:auto;
  display:inline-flex;align-items:center;gap:7px;
  height:34px;padding:0 13px;border-radius:10px;
  border:1px solid var(--outline-variant);
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--on-surface-variant);font-size:12.5px;font-weight:500;
  transition:all .18s ease;white-space:nowrap;
}
.chip.on{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
.chip i{
  width:8px;height:8px;border-radius:50%;background:currentColor;
  opacity:.5;font-style:normal;transition:opacity .18s;
}
.chip.on i{opacity:1}

.hint{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  font-size:11.5px;color:var(--on-surface-variant);
  background:color-mix(in srgb,var(--surface) 85%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:8px 14px;border-radius:20px;
  border:1px solid var(--outline-variant);
  pointer-events:none;text-align:center;max-width:92%;z-index:5;
}

.tooltip{
  position:absolute;pointer-events:none;z-index:20;
  padding:6px 12px;border-radius:8px;font-size:12px;font-weight:500;
  background:var(--surface-container-high);color:var(--on-surface);
  border:1px solid var(--outline-variant);box-shadow:var(--shadow);
  transform:translate(-50%,-140%);opacity:0;transition:opacity .15s ease;
  white-space:nowrap;
}
.tooltip.show{opacity:1}

/* ============ DIAGNOSTICS PANEL ============ */
.tabs{
  display:flex;padding:6px 8px 0;gap:4px;
  border-bottom:1px solid var(--outline-variant);flex:none;
}
.tab{
  flex:1;padding:14px 8px 12px;font-size:13px;font-weight:500;
  color:var(--on-surface-variant);border-bottom:3px solid transparent;
  transition:color .18s,border-color .18s;margin-bottom:-1px;
  border-radius:12px 12px 0 0;
}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

.panel-scroll{overflow-y:auto;padding:20px 18px;flex:1;scrollbar-width:thin}
.pane{display:none}
.pane.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Info card */
.info-card{
  background:var(--surface-container);border-radius:16px;
  padding:16px;margin-bottom:12px;
  border:1px solid var(--outline-variant);
}
.info-card h3{
  margin:0 0 4px;font-size:16px;font-weight:500;line-height:1.25;
}
.info-card .subtitle{
  font-size:11.5px;color:var(--on-surface-variant);
  margin:0 0 12px;font-style:italic;
}
.info-card p{margin:0;font-size:13px;line-height:1.6;color:var(--on-surface-variant)}

.stat-row{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0;
}
.stat-cell{
  background:var(--surface-container-high);border-radius:10px;
  padding:10px 12px;
}
.stat-cell .k{
  font-size:10px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--on-surface-variant);margin-bottom:3px;display:block;
}
.stat-cell .v{font-size:13.5px;font-weight:500}

.tag-list{
  display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0margin;list-style:none;
}
.tag-list li{
  font:-size:11.5px;padding:05px 11px; autoborder-radius:8px;
   background:var(--secondary-container);color:var(--on-secondary-container);
}
.tag-list.error li{
  background:var(--error-container);color:var(--error);
}

/* Empty state */
.empty-state{
  text-align:center;padding:48px 20px;color:var(--on-surface-variant);
}
.empty-state .ico{
  width:72px;height:72px;18px;border-radius:22px;
  background:var(--surface-container);display:grid;place-items:center;
}
.empty-state .ico svg{width:36px;height:36px;opacity:.5}
.empty-state p{margin:0;font-size:13.5px;line-height:1.6}

/* ============ SCRIM ============ */
.scrim{
  position:fixed;inset:64px 0 0 0;background:rgba(0,0,0,.5);z-index:34;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.scrim.show{opacity:1;pointer-events:auto}

/* ============ BADGE ============ */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:8px;font-size:11px;font-weight:600;
  background:var(--error-container);color:var(--error);
  margin-bottom:8px;
}

/* ============ RESPONSIVE ============ */
@media (max-width:1240px){
  .body{grid-template-columns:1fr 380px}
  .side-left{
    position:fixed;top:64px;bottom:0;left:0;width:300px;z-index:35;
    transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    box-shadow:var(--shadow-lg);
  }
  .side-left.open{transform:none}
  #menuBtn{display:grid!important}
}
@media (max-width:880px){
  .body{grid-template-columns:1fr}
  .side-right{
    position:fixed;top:64px;bottom:0;right:0;width:min(400px,94vw);z-index:35;
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    box-shadow:var(--shadow-lg);
  }
  .side-right.open{transform:none}
  #panelBtn{display:grid!important}
  .brand small{display:none}
}
@media (max-width:520px){
  .app{grid-template-rows:56px 1fr}
  .brand h1{font-size:15px}
  .viewport-top{gap:6px;top:10px;left:10px;right:10px}
  .chip{height:32px;padding:0 11px;font-size:11.5px}
  .hint{font-size:10.5px;padding:6px 12px;bottom:10px}
  .panel-scroll{padding:16px}
  .scrim{inset:56px 0 0 0}
  .side-left,.side-right{top:56px}
}
</style>
</head>
<body>

<div class="app">
  <header class="app-bar">
    <button class="icon-btn" id="menuBtn" aria-label="Слои анатомии">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
    </button>
    <div class="brand">
      <div class="brand-logo">NL</div>
      <div>
        <h1>NeuroLab</h1>
        <small>Интерактивная нейробиология</small>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="resetBtn" aria-label="Сбросить">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="Сменить тему">
      <svg viewBox="0 0 24 24" id="themeIcon"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A6.5 6.5 0 0 1 12 3z"/></svg>
    </button>
    <button class="icon-btn" id="panelBtn" aria-label="Диагностика">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
    </button>
  </header>

  <div class="body">
    <!-- ========== LEFT: LAYERS + PATHOLOGY ========== -->
    <nav class="side-panel side-left" id="drawer">
      <div class="panel-head">
        <span class="title">Управление</span>
        <button class="close-btn" id="closeDrawer" aria-label="Закрыть">
          <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>

      <div class="section-h">Слои анатомии</div>
      <div id="layerList"></div>

      <div class="section-h">Патологии</div>
      <div id="pathologyList"></div>

      <div id="severityBox" style="display:none">
        <div class="severity-box">
          <div class="severity-head">
            <label for="severitySlider">Тяжесть поражения</label>
            <span class="val" id="severityVal">50%</span>
          </div>
          <input type="range" id="severitySlider" min="0" max="100" value="50">
        </div>
      </div>
    </nav>

    <!-- ========== CENTER: 3D VIEWPORT ========== -->
    <main class="viewport" id="viewport">
      <canvas id="scene"></canvas>
      <div class="viewport-top">
        <button class="chip on" data-toggle="impulses"><i></i>Импульсы</button>
        <button class="chip on" data-toggle="labels"><i></i>Метки зон</button>
        <button class="chip" data-toggle="rotate"><i></i>Автоповорот</button>
        <button class="chip on" data-toggle="autoRotate"><i></i>Подсветка</button>
      </div>
      <div class="tooltip" id="tooltip"></div>
      <div class="hint">Крутите пальцем · Масштаб — щипок · Выбор зоны — тап</div>
    </main>

    <!-- ========== RIGHT: DIAGNOSTICS ========== -->
    <aside class="side-panel side-right" id="panel">
      <div class="tabs">
        <button class="tab active" data-pane="diagnostics">Диагностика</button>
        <button class="tab" data-pane="info">Анатомия</button>
        <button class="close-btn" id="closePanel" aria-label="Закрыть" style="margin-left:auto;align-self:center">
          <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="panel-scroll">
        <div class="pane active" id="pane-diagnostics"></div>
        <div class="pane" id="pane-info"></div>
      </div>
    </aside>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

    desc: 'Крупнейшая доля коры. Отвечает за исполнительные функции, произвольные движения, речь и социальное поведение.',
    functions: ['Планирование','Рабочая память','Произвольные движения','Речь (Брока)','Тормозный контроль'],
    stats: { 'Толщина': '2.5–3.0 мм', 'Нейронов': '≈ 3.5 млрд', 'Площадь': '≈ 30 %' }
  },
  parietal: {
    name: 'Теменная доля', latin: 'Lobus parietalis',

const AX = { x: 0.78, y: 0.92, z: 1.12 };

/* Многослойный шум коры */
function cortexNoise(x, y, z) {
  const n1 = Math.sin(x * 5.4 + 1.3) * Math.cos(y * 4.6 + 0.7) * Math.sin(z * 5.1 + 2.1) * 0.55;
  const n2 = Math.sin(x * 10.2 + y * 3.1) * Math.cos(z * 8.7 + x * 2.4) * 0.28;
  const n3 = Math.sin(y * 14.6 + z * 5.8) * Math.cos(x * 12.3 + 1.1) * 0.13;
  const n4 = Math.sin(z * 22.0 + y * 8.0) * Math.cos(x * 19.0 + z * 4.0) * 0.06;
  const n5 = Math.sin(x * 7.5 + z * 6.2) * Math.cos(y * 8.4) * 0.15;
  return n1 + n2 + n3 + n4 + n5;
}

function brainSurfacePoint(dir, offset = 0) {
  const v = dir.clone().normalize();
  const n = cortexNoise(v.x, v.y, v.z);
  v.multiplyScalar(1 + n * 0.08 + offset);
  v.x *= AX.x; v.y *= AX.y; v.z *= AX.z;
  return v;
}

function regionAt(p) {
  if (p.y < -0.32 && Math.abs(p.x) > 0.32 && p.z > -0.72) return 'temporal';
  if (p.z < -0.58) return 'occipital';
  if (p.z > 0.12)  return 'frontal';
  return 'parietal';
}

    v.multiplyScalar(1 + n * 0.08);
    v.x *= AX.x; v.y *= AX.y; v.z *= AX.z;
    const gap = 0.045 * Math.exp(-(v.x * v.x) / 0.005);
    v.x += (v.x >= 0 ? 1 : -1) * gap;
    if (v.y < -0.7) v.y *= 0.92;

  }
  cortexGeo.computeVertexNormals();
  cortexGeo.setAttribute('color', new THREE.BufferAttribute(
    new Float32Array(pos.count * 3), 3
  ));
}

  halo.userData = { type: 'subarea', id: sa.id, halo: true };
  markersGroup.add(halo);
  mesh.userData.halo = halo;
}); /* ==========================================================================
   10. RAYCASTING — ВЫБОР ЗОН
   ========================================================================== */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tooltipEl = document.getElementById('tooltip');

let hoveredRegion = null;
let selectedRegion = null;
let selectedSubarea = null;
let camTween = null;

function setPointerFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

function intersectAll() {
  raycaster.setFromCamera(pointer, camera);
  const objs = [];
  if (markersGroup.visible) objs.push(...markersGroup.children);
  if (cortexGroup.visible) objs.push(cortexMesh);
  return raycaster.intersectObjects(objs, false);
}

function pickRegionFromMesh(hit) {
  const local = cortexMesh.worldToLocal(hit.point.clone());
  return regionAt(local);
}

/* Hover (только desktop) */
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return;
  setPointerFromEvent(e);
  const hits = intersectAll();
  let label = null, regionId = null;

  if (hits.length) {
    const h = hits[0];
    if (h.object.userData.type === 'subarea') {
      const sa = SUBAREAS.find(s => s.id === h.object.userData.id);
      if (sa) { label = sa.name; regionId = sa.region; }
    } else if (h.object === cortexMesh) {
      regionId = pickRegionFromMesh(h);
      label = REGIONS[regionId].name;
    }
  }

  if (regionId !== hoveredRegion) {
    hoveredRegion = regionId;
    applyCortexHighlight();
    canvas.style.cursor = regionId ? 'pointer' : 'grab';
  }

  if (label && regionId) {
    const r = canvas.getBoundingClientRect();
    tooltipEl.textContent = label;
    tooltipEl.style.left = (e.clientX - r.left) + 'px';
    tooltipEl.style.top  = (e.clientY - r.top) + 'px';
    tooltipEl.classList.add('show');
  } else {
    tooltipEl.classList.remove('show');
  }
});

canvas.addEventListener('pointerleave', () => {
  tooltipEl.classList.remove('show');
  hoveredRegion = null;
  applyCortexHighlight();
});

/* Click / tap */
let downPos = null;
canvas.addEventListener('pointerdown', (e) => {
  downPos = { x: e.clientX, y: e.clientY };
});

canvas.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 8) return;

  setPointerFromEvent(e);
  const hits = intersectAll();
  if (!hits.length) {
    if (selectedRegion) {
      selectedRegion = null;
      selectedSubarea = null;
      applyCortexHighlight();
      renderAnatomyInfo();
      closePanelMobile();
    }
    return;
  }

  const h = hits[0];
  if (h.object.userData.type === 'subarea') {
    const sa = SUBAREAS.find(s => s.id === h.object.userData.id);
    if (sa) {
      selectRegion(sa.region, true);
      selectedSubarea = sa.id;
      focusOn(subareaPos[sa.id]);
      highlightSubareaInList(sa.id);
    }
  } else if (h.object === cortexMesh) {
    const rid = pickRegionFromMesh(h);
    selectRegion(rid, false);
    focusOn(h.point.clone().multiplyScalar(0.9));
  }
});

/* ==========================================================================
   11. ФОКУСИРОВКА КАМЕРЫ
   ========================================================================== */
function focusOn(point) {
  const dir = point.clone().normalize();
  const dist = 2.6;
  const toPos = dir.multiplyScalar(dist).add(new THREE.Vector3(0, 0.15, 0));
  camTween = {
    from: camera.position.clone(),
    to: toPos,
    fromT: controls.target.clone(),
    toT: point.clone().multiplyScalar(0.35),
    t: 0
  };
}

/* ==========================================================================
   12. ПОДСВЕТКА КОРЫ
   ========================================================================== */
function applyCortexHighlight() {
  const arr = cortexGeo.attributes.color.array;
  const active = selectedRegion || hoveredRegion;

  if (!active) {
    arr.set(baseColors);
  } else {
    const hi = new THREE.Color(REGIONS[active].color).multiplyScalar(1.45);
    const dim = 0.42;
    for (let i = 0; i < vertexRegion.length; i++) {
      if (vertexRegion[i] === active) {
        arr[i*3]   = hi.r;
        arr[i*3+1] = hi.g;
        arr[i*3+2] = hi.b;
      } else {
        arr[i*3]   = baseColors[i*3]   * dim;
        arr[i*3+1] = baseColors[i*3+1] * dim;
        arr[i*3+2] = baseColors[i*3+2] * dim;
      }
    }
  }
  cortexGeo.attributes.color.needsUpdate = true;

  markerMeshes.forEach(m => {
    const sa = SUBAREAS.find(s => s.id === m.userData.id);
    const on = !active || sa.region === active;
    m.material.opacity = on ? 1 : 0.3;
    m.material.transparent = true;
    m.userData.halo.material.opacity = on ? 0.18 : 0.04;
  });

  if (active) {
    cortexMat.emissive.setHex(REGIONS[active].color);
  } else {
    cortexMat.emissive.setHex(0x7c5cff);
  }
}

/* ==========================================================================
   13. СОСТОЯНИЕ ПРИЛОЖЕНИЯ
   ========================================================================== */
const state = {
  layers: {
    cortex: true,
    whiteMatter: true,
    brainstem: true,
    nerves: true

/* ==========================================================================
   14. УПРАВЛЕНИЕ СЛОЯМИ
   ========================================================================== */
function setLayerVisibility(id, visible) {
  if (id === 'cortex')      cortexGroup.visible = visible;
  if (id === 'whiteMatter') whiteMatterG.visible = visible;
  if (id === 'brainstem')   brainstemG.visible = visible;

/* ==========================================================================
   15. ЭФФЕКТЫ ПАТОЛОГИЙ
   ========================================================================== */
const lesionMeshes = [];
const lesionGroup = new THREE.Group();
brainGroup.add(lesionGroup);

function clearLesions() {
  lesionMeshes.forEach(m => {
    lesionGroup.remove(m);
    if (m.geometry) m.geometry.dispose();
    if (m.material) m.material.dispose();
  });
  lesionMeshes.length = 0;
}

function applyPathology(pathologyId, severity) {
  clearLesions();
  if (!pathologyId) {
    applyCortexHighlight();
    updatePathwayEffects();
    return;
  }

  const path = PATHOLOGIES.find(p => p.id === pathologyId);
  if (!path) return;

  const sev = severity / 100;

  // 1. Красные ореолы на поражённых подзонах
  path.affected.forEach(saId => {
    const p = subareaPos[saId];
    if (!p) return;

    const radius = 0.10 + sev * 0.12;
    const g = new THREE.SphereGeometry(radius, 16, 16);
    const m = new THREE.MeshBasicMaterial({
      color: path.colorHex,
      transparent: true,
      opacity: 0.15 + sev * 0.35,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const mesh = new THREE.Mesh(g, m);
    mesh.position.copy(p);
    mesh.renderOrder = 4;
    mesh.userData = { type: 'lesion', baseOpacity: 0.15 + sev * 0.35 };
    lesionGroup.add(mesh);
    lesionMeshes.push(mesh);
  });

  // 2. Подсветка поражённых долей красным оттенком в vertex colors
  const affectedRegions = new Set(path.primaryRegions);
  const arr = cortexGeo.attributes.color.array;
  const red = new THREE.Color(path.colorHex);
  const dim = 0.55;

  for (let i = 0; i < vertexRegion.length; i++) {
    const isAffected = affectedRegions.has(vertexRegion[i]);
    if (isAffected) {
      // Смешиваем базовый цвет с красным по уровню severity
      const baseR = baseColors[i*3];
      const baseG = baseColors[i*3+1];
      const baseB = baseColors[i*3+2];
      const mixAmt = sev * 0.55;
      arr[i*3]   = baseR * (1 - mixAmt) + red.r * mixAmt;
      arr[i*3+1] = baseG * (1 - mixAmt) + red.g * mixAmt;
      arr[i*3+2] = baseB * (1 - mixAmt) + red.b * mixAmt;
    } else {
      arr[i*3]   = baseColors[i*3]   * dim;
      arr[i*3+1] = baseColors[i*3+1] * dim;
      arr[i*3+2] = baseColors[i*3+2] * dim;
    }
  }
  cortexGeo.attributes.color.needsUpdate = true;

  // 3. Изменение emissive коры
  cortexMat.emissive.setHex(path.colorHex);
  cortexMat.emissiveIntensity = sev * 0.35;

  // 4. Эффект на путях — демиелинизация
  updatePathwayEffects();
}

function updatePathwayEffects() {
  const path = state.pathology ? PATHOLOGIES.find(p => p.id === state.pathology) : null;
  const sev = state.severity / 100;

  pathwayMeshes.forEach(tube => {
    const c = pathCurves[tube.userData.pathId];
    if (!c) return;

    const isAffected = path && (path.affected.includes(c.a) || path.affected.includes(c.b));

    if (isAffected) {
      // Повреждённый путь — красный, тусклый, «рваный»
      tube.material.color.setHex(0xE53935);
      tube.material.emissive.setHex(0x8a1f1a);
      tube.material.emissiveIntensity = 0.2 + (1 - sev) * 0.4;
      tube.material.opacity = 0.35 + (1 - sev) * 0.25;
    } else {
      tube.material.color.setHex(0x9b7cff);
      tube.material.emissive.setHex(0x5c3fd6);
      tube.material.emissiveIntensity = 0.6;
      tube.material.opacity = 0.55;
    }
  });

  // Импульсы — замедляются на повреждённых путях
  pulses.forEach(p => {
    const c = pathCurves[p.pathwayId];
    if (!c) return;
    const isAffected = path && (path.affected.includes(c.a) || path.affected.includes(c.b));

    if (isAffected) {
      p.speed = 0.02 + (1 - sev) * 0.06;
      p.mesh.material.color.setHex(0xE53935);
    } else {
      p.speed = 0.11;
      p.mesh.material.color.setHex(0xffc23d);
    }
  });
}

/* ==========================================================================
   16. ВЫБОР РЕГИОНА (для UI)
   ========================================================================== */
function selectRegion(id, fromSubarea) {

  });
}

/* ==========================================================================
   17. АНИМАЦИЯ
   ========================================================================== */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // Камера
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt * 1.9);
    const e = 1 - Math.pow(1 - camTween.t, 3);
    camera.position.lerpVectors(camTween.from, camTween.to, e);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    if (camTween.t >= 1) camTween = null;
  }

  // Импульсы
  if (state.chips.impulses && whiteMatterG.visible) {
    pulses.forEach(p => {
      p.t = (p.t + dt * p.speed) % 1;
      const pt = p.curve.getPointAt(p.t);
      p.mesh.position.copy(pt);
      const s = 0.8 + Math.sin(p.t * Math.PI) * 0.9;
      p.mesh.scale.setScalar(s);
      p.mesh.material.opacity = 0.35 + Math.sin(p.t * Math.PI) * 0.6;
    });
  }

  // Пульсация маркеров
  if (state.chips.labels && markersGroup.visible) {
    const s = 1 + Math.sin(t * 2.1) * 0.10;
    markerMeshes.forEach(m => {
      m.scale.setScalar(s);
      const on = !selectedRegion || SUBAREAS.find(x => x.id === m.userData.id).region === selectedRegion;
      m.material.emissiveIntensity = on ? (0.9 + Math.sin(t * 2.1) * 0.4) : 0.05;
    });
  }

  // Пульсация ореолов патологии
  if (lesionMeshes.length) {
    const basePulse = 1 + Math.sin(t * 3.5) * 0.15;
    lesionMeshes.forEach(m => {
      m.material.opacity = m.userData.baseOpacity * basePulse;
      const s = 1 + Math.sin(t * 3.5) * 0.08;
      m.scale.setScalar(s);
    });
  }

  // Свечение коры
  if (state.pathology) {
    // Уже установлено в applyPathology
  } else {
    const baseGlow = 0;
    const pulseAmt = Math.sin(t * 1.3) * 0.03;
    cortexMat.emissiveIntensity = baseGlow + pulseAmt;
  }

  // Дыхание света
  bottomLight.intensity = 1.0 + Math.sin(t * 0.8) * 0.3;

  controls.update();
  renderer.render(scene, camera);
} /* ==========================================================================

    <div class="info-card">
      <p class="section-h" style="margin-top:0">Ключевые функции</p>
      <ul class="tag-list">
        ${r.functions.map(f => `<li>${f}</li>`).join('')}
      </ul>
    </div>

    <div class="info-card">
      <p class="section-h" style="margin-top:0">Зоны внутри доли</p>
      ${subs.map(s => `
        <button class="sub-item" data-sub="${s.id}" style="margin-bottom:6px">
          <span class="pin"></span>
          <span>${s.name}</span>
          <span class="go">→</span>
        </button>
      `).join('')}
    </div>

    <div class="info-card" id="subNoteBox" style="display:none">
      <p class="section-h" style="margin-top:0">О зоне</p>
      <p id="subNoteText"></p>
    </div>
  `;

  paneInfo.querySelectorAll('.sub-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const sid = btn.dataset.sub;
      const sa = SUBAREAS.find(s => s.id === sid);
      if (!sa) return;
      selectedSubarea = sid;
      focusOn(subareaPos[sid]);
      highlightSubareaInList(sid);

      const box = document.getElementById('subNoteBox');
      const txt = document.getElementById('subNoteText');
      box.style.display = 'block';
      txt.innerHTML = `<b>${sa.name}</b><br>${sa.note}`;
    });
  });
}

const themeBtn = document.getElementById('themeBtn');
const themeIcon = document.getElementById('themeIcon');
const SUN  = '<path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5 2 3h-4l2-3zm0 20-2-3h4l-2 3zM2 12l3-2v4l-3-2zm20 0-3 2v-4l3 2zM5.6 5.6l3.2.8-2.4 2.4-.8-3.2zm12.8 12.8-3.2-.8 2.4-2.4.8 3.2zM5.6 18.4l.8-3.2 2.4 2.4-3.2.8zm12.8-12.8-.8 3.2-2.4-2.4 3.2-.8z"/>';
const MOON = '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A6.5 6.5 0 0 1 12 3z"/>';

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  themeIcon.innerHTML = t === 'dark' ? SUN : MOON;
  try { localStorage.setItem('nl-theme', t); } catch(e){}
}
themeBtn.addEventListener('click', () => {
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});
try {
  const saved = localStorage.getItem('nl-theme');
  if (saved) setTheme(saved);
  else if (matchMedia('(prefers-color-scheme: dark)').matches) setTheme('dark');
} catch(e){}

/* ==========================================================================
   27. RESET
   ========================================================================== */
document.getElementById('resetBtn').addEventListener('click', () => {
  // Сброс патологии
  selectPathology(null);
  // Сброс слоёв
  Object.keys(state.layers).forEach(k => {
    state.layers[k] = true;
    setLayerVisibility(k, true);
  });
  document.querySelectorAll('.layer-switch').forEach(el => el.classList.add('on'));

/* ==========================================================================
   28. БОКОВЫЕ ПАНЕЛИ + СВАЙПЫ
   ========================================================================== */
const drawer = document.getElementById('drawer');
const panel  = document.getElementById('panel');
const scrim  = document.getElementById('scrim');

function openDrawerMobile(){
  drawer.classList.add('open');
  panel.classList.remove('open');
  scrim.classList.add('show');
}
function closeDrawerMobile(){
  drawer.classList.remove('open');
  if (!panel.classList.contains('open')) scrim.classList.remove('show');
}
function openPanelMobile(){
  if (innerWidth <= 880) {
    panel.classList.add('open');
    drawer.classList.remove('open');
    scrim.classList.add('show');
  }
}
function closePanelMobile(){
  panel.classList.remove('open');
  if (!drawer.classList.contains('open')) scrim.classList.remove('show');
}

document.getElementById('menuBtn').addEventListener('click', () => {
  if (drawer.classList.contains('open')) closeDrawerMobile();
  else openDrawerMobile();
});
document.getElementById('panelBtn').addEventListener('click', () => {
  if (panel.classList.contains('open')) closePanelMobile();
  else openPanelMobile();
});
document.getElementById('closeDrawer').addEventListener('click', closeDrawerMobile);
document.getElementById('closePanel').addEventListener('click', closePanelMobile);
scrim.addEventListener('click', () => { closeDrawerMobile(); closePanelMobile(); });

/* Свайпы */
function addSwipeClose(el, direction, onClose) {
  let startX = 0, startY = 0, tracking = false;
  el.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY; tracking = true;
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    if (!tracking) return;
    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if (direction === 'right' && dx > 60 && Math.abs(dy) < 80) { tracking = false; onClose(); }
    if (direction === 'left' && dx < -60 && Math.abs(dy) < 80) { tracking = false; onClose(); }
  }, { passive: true });
  el.addEventListener('touchend', () => { tracking = false; }, { passive: true });
}
addSwipeClose(drawer, 'right', closeDrawerMobile);
addSwipeClose(panel, 'left', closePanelMobile);

/* Escape */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeDrawerMobile();
    closePanelMobile();
    if (selectedRegion) {
      selectedRegion = null;
      applyCortexHighlight();
      renderAnatomyInfo();
    }
  }
});

/* ==========================================================================
   29. RESIZE
   ========================================================================== */
function resize() {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  if (w === 0 || h === 0) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(viewport);
resize();
